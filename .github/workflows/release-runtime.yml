name: Release C++ GIS MCP Runtime

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libcurl4-openssl-dev libgdal-dev libbz2-dev libexpat1-dev zlib1g-dev

      - name: Configure
        run: |
          cmake -S . -B build_dev/release-linux-x86_64 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_MCP_EXAMPLES=OFF \
            -DBUILD_GIS=ON -DBUILD_ROUTING=ON -DBUILD_TESTING=ON

      - name: Build and test
        run: |
          cmake --build build_dev/release-linux-x86_64 -j2
          ctest --test-dir build_dev/release-linux-x86_64 --output-on-failure

      - name: Assemble runtime archive
        run: |
          cmake --install build_dev/release-linux-x86_64 --component Runtime --prefix build_dev/runtime-root
          bash packaging/verify-install.sh --prefix build_dev/runtime-root
          tar -C build_dev/runtime-root -czf mcp-server-gis-linux-x86_64.tar.gz .
          sha256sum mcp-server-gis-linux-x86_64.tar.gz > mcp-server-gis-linux-x86_64.tar.gz.sha256

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            mcp-server-gis-linux-x86_64.tar.gz
            mcp-server-gis-linux-x86_64.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-gis-linux-x86_64
          path: |
            mcp-server-gis-linux-x86_64.tar.gz
            mcp-server-gis-linux-x86_64.tar.gz.sha256
